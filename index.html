<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Hours Calculator</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--text:#e8eaf0;--mute:#8b93a7;--accent:#4f9cff;--good:#3ecf8e;--warn:#f5a524;--bad:#f25f5c}
  @media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--line:#dde2ea;--text:#151922;--mute:#5d667a}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.4}
  main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--mute);margin:0 0 20px;font-size:.9rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--mute);flex:1;min-width:130px}
  input{font:inherit;font-size:1.1rem;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row+.row{margin-top:12px}
  button{font:inherit;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:var(--line);color:var(--text)}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{flex:1}
  .tabs button.on{background:var(--accent);color:#fff;font-weight:600}
  .result{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}
  .stat span{color:var(--mute);font-size:.8rem}
  .bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px}
  .bar>div{height:100%;background:var(--good);transition:width .2s}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.92rem}
  .ok{background:color-mix(in srgb,var(--good) 16%,transparent)}
  .warn{background:color-mix(in srgb,var(--warn) 20%,transparent)}
  .bad{background:color-mix(in srgb,var(--bad) 22%,transparent)}
  .days{display:flex;gap:6px;flex-wrap:wrap}
  .days button{padding:8px 10px;min-width:46px}
  .days button.on{background:var(--accent);color:#fff;font-weight:600}
  .plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-top:10px}
  .plan div{border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-size:.85rem;color:var(--mute)}
  .plan div b{display:block;font-size:1.1rem;color:var(--text);font-variant-numeric:tabular-nums}
  .plan div.now{border-color:var(--accent)}
  .hint{color:var(--mute);font-size:.8rem;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>⏱ Weekly Hours Calculator</h1>
  <p class="sub">Figure out when to stop so you stay under your weekly cap.</p>

  <section class="card">
    <div class="row">
      <label>Hours worked so far this week<input id="worked" placeholder="e.g. 9:45 or 9.75" inputmode="decimal"></label>
      <label>Weekly cap (hours)<input id="cap" value="15" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>Workday opens<input type="time" id="winStart" value="07:00"></label>
      <label>Workday closes<input type="time" id="winEnd" value="21:00"></label>
    </div>
    <div class="row">
      <label>Days I work (week runs Mon–Sun)<span id="days" class="days"></span></label>
    </div>
  </section>

  <section class="card">
    <div id="today" style="font-weight:600;margin-bottom:8px"></div>
    <div id="rec"></div>
    <div id="plan" class="plan"></div>
    <button id="useRec" style="margin-top:12px">Use today's recommendation</button>
  </section>

  <section class="card">
    <div class="tabs">
      <button id="tabPlan" class="on">I want to work X hours</button>
      <button id="tabRange">Start → end time</button>
    </div>
    <div class="row">
      <label>Start time<input type="time" id="start"></label>
      <button id="now">Now</button>
    </div>
    <div class="row" id="planRow">
      <label>Hours I want to work<input id="want" placeholder="e.g. 2:30 or 2.5 (blank = max)" inputmode="decimal"></label>
    </div>
    <div class="row" id="endRow" hidden>
      <label>End time<input type="time" id="end"></label>
    </div>
    <p class="hint">Times can be entered as h:mm (2:30) or decimal hours (2.5).</p>
  </section>

  <section class="card">
    <div class="result">
      <div class="stat"><b id="rShift">—</b><span>This shift</span></div>
      <div class="stat"><b id="rEnd">—</b><span>Stop at</span></div>
      <div class="stat"><b id="rTotal">—</b><span>Week total after</span></div>
      <div class="stat"><b id="rLeft">—</b><span>Left for the week</span></div>
    </div>
    <div class="bar"><div id="fill" style="width:0"></div></div>
    <div id="msg"></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
let mode='plan';

// "9:45" or "9.75" -> minutes
function parseHrs(v){
  v=(v||'').trim(); if(!v) return null;
  const m=v.match(/^(\d+):(\d{1,2})$/); if(m) return +m[1]*60 + +m[2];
  const n=parseFloat(v); return isNaN(n)||n<0 ? null : Math.round(n*60);
}
function fmt(min){const neg=min<0;min=Math.abs(Math.round(min));return (neg?'-':'')+Math.floor(min/60)+':'+pad(min%60)}
function toMin(t){if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m}
function clock(min){min=((min%1440)+1440)%1440;const h=Math.floor(min/60),m=min%60;
  return (h%12||12)+':'+pad(m)+(h<12?' AM':' PM')}

function calc(){
  const cap=(parseHrs($('cap').value)??900), worked=parseHrs($('worked').value)??0;
  const avail=cap-worked, start=toMin($('start').value);
  const wS=toMin($('winStart').value)??420, wE=toMin($('winEnd').value)??1260;
  const winLeft = start==null ? null : Math.max(0, wE-Math.max(start,wS));
  const maxShift = winLeft==null ? avail : Math.max(0, Math.min(avail, winLeft));
  let shift=null, end=null, overnight=false;

  if(start!=null){
    if(mode==='plan'){
      const want=parseHrs($('want').value);
      shift = want==null ? maxShift : want;
      end = start+shift;
    }else{
      const e=toMin($('end').value);
      if(e!=null){ shift=e-start; if(shift<0){shift+=1440;overnight=true} end=start+shift; }
    }
  }

  const total = worked + (shift??0), left = cap-total;
  $('rShift').textContent = shift==null?'—':fmt(shift);
  $('rEnd').textContent = end==null?'—':clock(end)+(end>=1440?' (+1d)':'');
  $('rTotal').textContent = fmt(total);
  $('rLeft').textContent = fmt(left);
  $('rLeft').style.color = left<0?'var(--bad)':'';
  const f=$('fill'); f.style.width=Math.min(100,cap?total/cap*100:0)+'%';
  f.style.background = left<0?'var(--bad)':left<=30?'var(--warn)':'var(--good)';

  let m='';
  if(avail<=0) m=`<div class="msg bad">You've already hit your ${fmt(cap)} cap this week${avail<0?' (over by '+fmt(-avail)+')':''}.</div>`;
  else if(left<0) m=`<div class="msg bad">That's ${fmt(-left)} over the cap. Latest stop: <b>${clock(start+maxShift)}</b> (max ${fmt(maxShift)} this shift).</div>`;
  else if(start!=null && shift!=null) m=`<div class="msg ok">You're good. Max you could work this shift: ${fmt(maxShift)} → stop by ${clock(start+maxShift)}${maxShift<avail?' (workday closes at '+clock(wE)+')':''}.</div>`;
  else m=`<div class="msg ok">You have <b>${fmt(avail)}</b> left this week.</div>`;
  if(start!=null && avail>0){
    if(start<wS || start>=wE) m+=`<div class="msg warn">Start time is outside working hours (${clock(wS)}–${clock(wE)}).</div>`;
    else if(end!=null && end>wE) m+=`<div class="msg warn">Ends after the workday closes at ${clock(wE)}. Latest stop: <b>${clock(start+maxShift)}</b>.</div>`;
  }
  if(overnight) m+='<p class="hint">End is earlier than start, so this is treated as an overnight shift.</p>';
  $('msg').innerHTML=m;
  recommend(avail, wE-wS);

  try{localStorage.setItem('whc',JSON.stringify({w:$('worked').value,c:$('cap').value,a:$('winStart').value,b:$('winEnd').value,d:workDays}))}catch(e){}
}

// Day-of-week recommendation. Index 0=Mon … 6=Sun
const NAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
let workDays=[1,1,1,1,1,0,0], recToday=null;
const todayIdx=()=>(new Date().getDay()+6)%7;

function drawDays(){
  $('days').innerHTML=NAMES.map((n,i)=>`<button data-d="${i}" class="${workDays[i]?'on':''}">${n}</button>`).join('');
}
$('days').onclick=e=>{const d=e.target.dataset.d;if(d==null)return;workDays[+d]^=1;drawDays();calc()};

function recommend(avail, dayLen){
  const t=todayIdx(), left=[];
  for(let i=t;i<7;i++) if(workDays[i]) left.push(i);
  $('today').textContent=`Today is ${FULL[t]}`+(workDays[t]?'':' (not a work day)');
  recToday=null;
  if(avail<=0){$('rec').innerHTML='<div class="msg bad">No hours left this week. Take the rest of the week off.</div>';$('plan').innerHTML='';return}
  if(!left.length){$('rec').innerHTML=`<div class="msg warn">No work days left this week. ${fmt(avail)} unused.</div>`;$('plan').innerHTML='';return}
  // spread evenly, round to 15 min, no day longer than the workday
  const per=Math.min(dayLen, Math.floor(avail/left.length/15)*15);
  let rem=avail; const alloc={};
  left.forEach(i=>{alloc[i]=Math.min(per,rem);rem-=alloc[i]});
  for(const i of left){ if(rem<=0)break; const add=Math.min(rem,dayLen-alloc[i]); alloc[i]+=add; rem-=add; } // leftover minutes go to earliest days
  recToday=workDays[t]?alloc[t]:null;
  $('rec').innerHTML=`You have <b>${fmt(avail)}</b> left across <b>${left.length}</b> work day${left.length>1?'s':''}`
    +` (${workDays[t]?'including today':'starting '+FULL[left[0]]}). Recommended: about <b>${fmt(avail/left.length)}</b> per day.`
    +(rem>0?`<div class="msg warn">Even full days can't use all your hours: ${fmt(rem)} would go unused.</div>`:'');
  $('plan').innerHTML=left.map(i=>`<div class="${i===t?'now':''}">${NAMES[i]}<b>${fmt(alloc[i])}</b></div>`).join('');
  $('useRec').hidden=recToday==null;
}
$('useRec').onclick=()=>{if(recToday==null)return;setMode('plan');$('want').value=fmt(recToday);calc()};

function setNow(){const d=new Date();$('start').value=pad(d.getHours())+':'+pad(d.getMinutes());calc()}
function setMode(m){mode=m;$('tabPlan').classList.toggle('on',m==='plan');$('tabRange').classList.toggle('on',m==='range');
  $('planRow').hidden=m!=='plan';$('endRow').hidden=m!=='range';calc()}

document.querySelectorAll('input').forEach(i=>i.addEventListener('input',calc));
$('now').onclick=setNow;
$('tabPlan').onclick=()=>setMode('plan');
$('tabRange').onclick=()=>setMode('range');
try{const s=JSON.parse(localStorage.getItem('whc'));if(s){$('worked').value=s.w||'';$('cap').value=s.c||'15';$('winStart').value=s.a||'07:00';$('winEnd').value=s.b||'21:00';if(Array.isArray(s.d))workDays=s.d}}catch(e){}
drawDays();
setNow();
</script>
<!-- GoatCounter analytics — privacy-friendly, no cookies -->
<script data-goatcounter="https://saumyaroy.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
